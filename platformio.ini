[platformio]
default_envs = xiao_esp32s3_sense

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:xiao_esp32s3_sense]
; 캣센서: XIAO ESP32S3 Sense + OV3660
board = seeed_xiao_esp32s3
build_src_filter = +<camera_node/**> -<display_node/**>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_camera_probe]
board = seeed_xiao_esp32s3
build_src_filter = +<camera_probe/**> -<camera_node/**> -<display_node/**>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:radar_node_c3]
; 레이더 노드 (Phase R1): XIAO ESP32C3 + LD2454, 파서 + 게이트웨이 전송
board = seeed_xiao_esp32c3
build_src_filter = +<radar_node/**> -<camera_node/**> -<camera_probe/**> -<display_node/**> -<radar_probe/**>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:radar_probe_c3]
; LD2454 관찰 도구 (Phase R0): XIAO ESP32C3 + LD2454 UART, 수신 전용
board = seeed_xiao_esp32c3
build_src_filter = +<radar_probe/**> -<camera_node/**> -<camera_probe/**> -<display_node/**>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:display_esp32s3]
; 캣모니터: ESP32-S3 WROOM-1-N16R8 + TFT + buttons
board = esp32-s3-devkitc-1
; N16R8 = quad SPI flash + octal PSRAM. 둘 다 켜야 ps_malloc이 8MB를 본다.
board_build.arduino.memory_type = qio_opi
build_flags =
  -D BOARD_HAS_PSRAM
build_src_filter = +<display_node/**> -<camera_node/**>
lib_deps =
  adafruit/Adafruit GFX Library @ ^1.12.0
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  bodmer/TJpg_Decoder @ ^1.1.0
